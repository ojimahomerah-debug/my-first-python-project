<!DOCTYPE html>
<html>

<head>

    <title>StudentHub</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        /* HEADER */

        header {
            background: #2563eb;
            color: white;
            padding: 25px 40px;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin: 8px 0 0;
            opacity: 0.9;
        }


        /* MAIN */

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }


        /* STAT CARDS */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .stat h2 {
            margin: 0;
            font-size: 32px;
            color: #2563eb;
        }

        .stat p {
            margin-bottom: 0;
            color: #64748b;
        }


        /* STUDENT SECTION */

        .section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        /* SEARCH */

        input {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            width: 250px;
        }


        /* STUDENT CARDS */

        .students {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .student {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            transition: 0.3s;
        }

        .student:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .avatar {
            width: 55px;
            height: 55px;
            background: #dbeafe;
            color: #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
        }

        .student h3 {
            margin-bottom: 5px;
        }

        .student p {
            color: #64748b;
        }


        /* PROGRESS */

        .progress {
            background: #e2e8f0;
            height: 8px;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            background: #2563eb;
            height: 100%;
            width: 70%;
        }


        /* BUTTON */

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }


        @media (max-width: 800px) {

            .stats,
            .students {
                grid-template-columns: 1fr;
            }

            input {
                width: 100%;
                margin-top: 10px;
            }

            .section-header {
                display: block;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>🎓 StudentHub</h1>

    <p>Student Management Dashboard</p>

</header>


<div class="container">


    <!-- STATISTICS -->

    <div class="stats">

        <div class="stat">

            <h2 id="studentCount">0</h2>

            <p>Total Students</p>

        </div>


        <div class="stat">

            <h2>3</h2>

            <p>Available Courses</p>

        </div>


        <div class="stat">

            <h2>85%</h2>

            <p>Average Progress</p>

        </div>

    </div>


    <!-- STUDENTS -->

    <div class="section">

        <div class="section-header">

            <div>

                <h2>👨‍🎓 Our Students</h2>

                <p>View and manage students</p>

            </div>


            <input
                type="text"
                id="search"
                placeholder="🔍 Search student..."
                onkeyup="searchStudents()"
            >

        </div>


        <div class="students" id="students">

        </div>

    </div>


</div>


<script>


let allStudents = [];


async function loadStudents() {

    const response = await fetch("/students");

    const data = await response.json();

    allStudents = data.students;

    displayStudents(allStudents);

}


function displayStudents(students) {

    const container = document.getElementById("students");

    container.innerHTML = "";


    document.getElementById("studentCount").textContent =
        students.length;


    students.forEach(function(student) {

        const firstLetter =
            student.name.charAt(0).toUpperCase();


        container.innerHTML += `

            <div class="student">

                <div class="avatar">
                    ${firstLetter}
                </div>

                <h3>${student.name}</h3>

                <p>🎂 Age: ${student.age}</p>

                <p>📚 ${student.course}</p>

                <p>Progress</p>

                <div class="progress">

                    <div class="progress-bar"></div>

                </div>

            </div>

        `;

    });

}


function searchStudents() {

    const search =
        document.getElementById("search").value.toLowerCase();


    const filtered =
        allStudents.filter(function(student) {

            return student.name
                .toLowerCase()
                .includes(search);

        });


    displayStudents(filtered);

}


loadStudents();


</script>


</body>

</html>
